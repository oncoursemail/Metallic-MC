name: Go foundation checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Go vet
        run: go vet ./...
      - name: Go unit tests
        run: go test -race -count=1 ./...
      - name: Private pilot unit and lifecycle tests
        run: python3 -m unittest discover -s tools -p pilot_test.py -v
      - name: Private service bundle tests
        run: python3 -m unittest discover -s infra/systemd -p '*_test.py' -v
      - name: Build controller and agent
        run: |
          go build -o /tmp/metallic-control ./cmd/metallic-control
          go build -o /tmp/metallic-agent ./cmd/metallic-agent
